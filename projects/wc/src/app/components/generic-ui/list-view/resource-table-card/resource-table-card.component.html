<mfp-declarative-table-card
  data-testid="generic-list-view-table"
  [resources]="tableResources()"
  [config]="config()"
  [loading]="loading()"
  [error]="listError() || watchError()"
  [permissions]="instancePermissionsStore.permissions()"
  [createFormState]="createFormState()"
  [editFormState]="editFormState()"
  (tableRowClicked)="navigateToResource($event)"
  (loadMoreResources)="loadMore()"
  (retry)="retryList()"
  (paginationLimitChanged)="onLimitChange($event)"
  (actionButtonClick)="executeAction($event)"
  (createFieldChange)="onCreateFieldChange($event)"
  (createDialogClosed)="onCreateDialogClosed()"
  (createSubmit)="onCreateSubmit($event)"
  (editFieldChange)="onEditFieldChange($event)"
  (editDialogClosed)="onEditDialogClosed()"
  (editSubmit)="onEditSubmit($event)"
  (deleteSubmit)="delete($event)"
/>
