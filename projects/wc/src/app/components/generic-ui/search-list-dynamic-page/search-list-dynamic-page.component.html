<ui5-dynamic-page>
  <ui5-dynamic-page-title slot="titleArea">
    <ui5-title slot="heading">{{ resourceTitleDefinition() }}</ui5-title>
    <p slot="subheading">{{ resourceDescriptionDefinition() }}</p>

    <div slot="snappedHeading" class="snapped-heading">
      <pm-resource-logo [resourceDefinition]="resourceDefinition()" />
      <div class="snapped-heading-text">
        <ui5-title wrapping-type="None">{{
          resourceTitleDefinition()
        }}</ui5-title>
        <p>{{ resourceDescriptionDefinition() }}</p>
      </div>
    </div>

    <ui5-toolbar slot="actionsBar" design="Transparent">
      @if (hasUiCreateViewFields() && canCreate()) {
        <ui5-toolbar-button
          design="Emphasized"
          data-testid="search-list-create-button"
          [text]="'Create'"
          (click)="openCreateModal()"
        />
      }
      @for (action of actions(); track action.property) {
        @if (canDo(action.requirePermission)) {
          <mfp-resource-field
            [fieldDefinition]="action"
            (buttonClick)="genericActionHandler($event)"
          />
        }
      }
    </ui5-toolbar>
  </ui5-dynamic-page-title>

  <ui5-dynamic-page-header slot="headerArea">
    <pm-resource-logo [resourceDefinition]="resourceDefinition()" />
    <!-- future: filter bar (#591) -->
  </ui5-dynamic-page-header>
  <mfp-declarative-table
    [columns]="columns()"
    [resources]="tableResources()"
    [loading]="loading()"
    [permissions]="instancePermissionsStore.permissions()"
    [totalItemsCount]="totalItemsCount()"
    [paginationLimit]="paginationLimit()"
    [hasMore]="hasMore()"
    [currentPage]="currentPage()"
    itemsPerPageLabel="Results per Page"
    totalItemsLabel="Results"
    loadMode="pager"
    (buttonClick)="genericActionHandler($event)"
    (tableRowClicked)="navigateToResource($event)"
    (pageChange)="onPageChange($event)"
    (paginationLimitChanged)="onLimitChange($event)"
  />
</ui5-dynamic-page>

<pm-resource-form-modal
  #createModal
  [context]="context()"
  [fields]="createFields()"
  (resource)="onCreateSubmit($event)"
/>
